version: '3.8'

services:
  db:
    image: postgres:16
    container_name: agriintel-db
    environment:
      POSTGRES_DB: agriintel
      POSTGRES_USER: agriintel
      POSTGRES_PASSWORD: agriintel
    ports:
      - '5432:5432'
    volumes:
      - agriintel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agriintel -d agriintel']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriintel-api
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://agriintel:agriintel@db:5432/agriintel
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - /app/node_modules
    command: yarn start

volumes:
  agriintel_pgdata:
